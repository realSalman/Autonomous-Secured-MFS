# autonomous-secureassist-mfs — Full Stack
#
# Usage:
#   cp .env.example .env          # add your LLM API key
#   docker compose up -d          # start everything
#   open http://localhost:3001

services:

  # ── Database ──

  postgres:
    image: postgres:16-alpine
    container_name: autonomous-secureassist-mfs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: autonomous-secureassist-mfs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: autonomous-secureassist-mfs
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autonomous-secureassist-mfs"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Seed sample data (runs once, then exits) ──

  seed:
    build: .
    container_name: autonomous-secureassist-mfs-seed
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://autonomous-secureassist-mfs:${POSTGRES_PASSWORD:-password}@postgres:5432/autonomous-secureassist-mfs
    command: ["npx", "tsx", "server/src/db/seed.ts"]
    restart: "no"

  # ── Application (API + Client on port 3001) ──

  app:
    build: .
    container_name: autonomous-secureassist-mfs-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://autonomous-secureassist-mfs:${POSTGRES_PASSWORD:-password}@postgres:5432/autonomous-secureassist-mfs
      PORT: 3001
      NODE_ENV: production
      OJURI_ENABLED: "true"
      OJURI_API_URL: http://autonomous-secureassist-mfs-fraud-detector-rda:3000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ═══════════════════════════════════════════════════════
  # Ojuri Fraud Detection
  # ═══════════════════════════════════════════════════════
  # To enable: clone ojuri repo, then uncomment below
  #
  #   git clone https://github.com/ojuri-io/ojuri ../ojuri
  #
  # Then uncomment the services below and run:
  #   docker compose up -d --build
  # ═══════════════════════════════════════════════════════

  redis:
    image: redis:7-alpine
    container_name: autonomous-secureassist-mfs-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: autonomous-secureassist-mfs-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: autonomous-secureassist-mfs-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10

  fraud-migrate:
    build: ./server/fraud_detector
    container_name: autonomous-secureassist-mfs-fraud-detector-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://autonomous-secureassist-mfs:${POSTGRES_PASSWORD:-password}@postgres:5432/fraud_db
      NODE_ENV: production
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: fraud_db
      DB_USERNAME: autonomous-secureassist-mfs
      DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      KNEX_MIGRATIONS_DIR: /app/dist/database/migrations
      KNEX_SEEDS_DIR: /app/dist/database/seeds
    command: 
      - sh
      - -c
      - "if [ -f ./dist/database/normalize-migration-names.cli.js ]; then node ./dist/database/normalize-migration-names.cli.js; fi && node ./node_modules/knex/bin/cli.js --knexfile knexfile.js migrate:latest && node ./node_modules/knex/bin/cli.js --knexfile knexfile.js seed:run"
    restart: "no"

  rda:
    build: ./server/fraud_detector
    container_name: autonomous-secureassist-mfs-fraud-detector-rda
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      fraud-migrate:
        condition: service_completed_successfully
    ports:
      - "3002:3000"
    volumes:
      - ./server/fraud_detector/models:/app/models:ro
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: fraud_db
      DB_USERNAME: autonomous-secureassist-mfs
      DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      DB_URL: postgresql://autonomous-secureassist-mfs:${POSTGRES_PASSWORD:-password}@postgres:5432/fraud_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092
      FRAUD_THRESHOLD: 0.65
      ALLOW_UNSAFE_PROD_DEFAULTS: "true"

  paa:
    build: ./server/fraud_detector/paa-service
    container_name: autonomous-secureassist-mfs-fraud-detector-paa
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      fraud-migrate:
        condition: service_completed_successfully
    environment:
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: fraud_db
      DB_USERNAME: autonomous-secureassist-mfs
      DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      DB_URL: postgresql://autonomous-secureassist-mfs:${POSTGRES_PASSWORD:-password}@postgres:5432/fraud_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092

volumes:
  pgdata:
  redisdata:
